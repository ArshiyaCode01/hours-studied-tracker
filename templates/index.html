<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hours Studied Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Hours Studied Tracker</h1>

        <!-- Dashboard Total Hours Card -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body text-center">
                        <h3 class="card-title">Total Hours Studied</h3>
                        <p class="display-4 font-weight-bold">{{ total_hours }} hrs</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Manual Time Entry Form -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white"><h5>Add Study Session</h5></div>
            <div class="card-body">
                <form action="/add" method="POST" class="row g-3">
                    <div class="col-md-4">
                        <label for="subject" class="form-label">Subject Name</label>
                        <input type="text" class="form-control" id="subject" name="subject" required>
                    </div>
                    <div class="col-md-3">
                        <label for="duration" class="form-label">Duration (Hours)</label>
                        <input type="number" step="0.5" class="form-control" id="duration" name="duration" required>
                    </div>
                    <div class="col-md-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" name="date">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Add Log</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Read & Delete Log Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5>Study History</h5></div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Duration (hrs)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <td>{{ log.date }}</td>
                            <td>{{ log.subject }}</td>
                            <td>{{ log.duration }}</td>
                            <td>
                                <form action="/delete/{{ log.id }}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No study logs added yet. Start tracking above!</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
